spring.application.name=cwmAi
# 부팅 시 CWMAI 배너 표시 (resources/banner.txt)
spring.banner.location=classpath:banner.txt
spring.main.banner-mode=console

# spring.datasource.* 는 main()에서 config.txt에 DB_URL 있을 때만 설정함 (없으면 DataSource 비활성화)

# Ollama (config.txt의 OLLAMA_HOST 없으면 로컬 기본값)
ollama.host=${OLLAMA_HOST:http://localhost:11434}

# 로그 최소화 (배포용)
logging.level.root=WARN
logging.level.com.example.cwmAi=WARN
# Netty MacOS DNS 경고를 ERROR → WARN으로 (기능은 정상 동작)
logging.level.io.netty.resolver.dns.DnsServerAddressStreamProviders=WARN
# MyBatis mapper 스캔 경고 억제 (DB 미사용 시 패키지 스캔만 할 때)
logging.level.org.mybatis.spring.mapper.ClassPathMapperScanner=WARN

# RAG 파이프라인 버전
# 1 : LLM1(조항 선택) + LLM2(답변 생성) — 2단계
# 2 : 벡터검색 top-K → LLM 직접 답변 — 1단계 (빠름)
rag.pipeline.version=1
server.port=9090
# Access 로그: AccessLogConfig에서 JAR 기준 log/ 폴더에 월별(access_log.yyyy-MM.log)로 기록 

# config.txt에 DB_URL 있을 때 MyBatis 사용 (member 테이블: id, password, name, email)
mybatis.mapper-locations=classpath:/mapper/*.xml
mybatis.type-aliases-package=com.example.cwmAi.dto

spring.codec.max-in-memory-size=20MB
spring.webflux.timeout.connection=300000
spring.webflux.timeout.response=600000
spring.webflux.timeout.read=600000
spring.webflux.timeout.write=600000

spring.mvc.async.request-timeout=600000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#?? ? env? ???
#security.jwt.secret=${CWM_JWT_SECRET}
security.jwt.secret=your-secret-key-cwmai-0123456789abcdef01234