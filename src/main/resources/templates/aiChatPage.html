<!-- src/main/resources/templates/aiChatPage.html (UI/UX 개선 버전) -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<script th:inline="javascript">
    /*<![CDATA[*/
    const isAdmin = /*[[${isAdmin}]]*/ false;
    /*]]>*/
</script>
<head>
    <meta charset="UTF-8">
    <title>CWMAI</title>
    <link rel="icon" type="image/png" th:href="@{/images/Cw_ci.png}">
    <style>
        /* 기본 레이아웃 및 리셋 */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; background-color: #f4f4f4; }
        .container { display: flex; width: 100%; box-shadow: 0 0 10px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
        .pane { padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; background-color: #fff; }
        .left-pane { flex: 2; border-right: 1px solid #ddd; transition: flex 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .left-pane.expanded { flex: 1; }
        .right-pane {
            flex: 1;
            min-width: 300px;
            transition: flex 0.5s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.5s cubic-bezier(0.4, 0, 0.2, 1), padding 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, visibility 0s, transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }
        .right-pane.hidden {
            flex: 0 0 0;
            min-width: 0;
            padding: 0;
            margin: 0;
            transform: translateX(100%);
            opacity: 0;
            visibility: hidden;
            transition: flex 0.5s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.5s cubic-bezier(0.4, 0, 0.2, 1), padding 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease 0.2s, visibility 0s 0.5s, transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            overflow: hidden;
            border: none;
        }

        /* 파일 관리 영역 토글 버튼 */
        .toggle-file-pane-btn {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 80px;
            background-color: #003b83;
            color: white;
            border: none;
            border-radius: 8px 0 0 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 10;
            box-shadow: -2px 0 5px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .toggle-file-pane-btn:hover {
            background-color: #002a5e;
            width: 45px;
        }
        .toggle-file-pane-btn.hidden {
            display: none;
        }

        /* AI 채팅 영역 */
        #chatBox {
            flex-grow: 1;
            border: 1px solid rgba(255,255,255,0.9);
            border-radius: 18px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 10px;
            background: linear-gradient(160deg, rgba(205,212,222,0.75) 0%, rgba(215,220,230,0.62) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow:
                0 8px 32px rgba(0,59,131,0.14),
                inset 0 1px 0 rgba(255,255,255,0.80),
                inset 0 -1px 0 rgba(0,59,131,0.06);
        }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 15px; max-width: 80%; display: flex; align-items: flex-start; gap: 6px; }
        .user {
            background: linear-gradient(135deg, #003b83, #2b485f);
            color: white;
            align-self: flex-end;
            margin-left: auto;
            box-shadow: 0 4px 14px rgba(0,59,131,0.25);
        }
        .ai {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #1a2a4a;
            margin-right: auto;
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 2px 10px rgba(0,59,131,0.07);
        }
        .ai-avatar { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; object-fit: cover; background-color: #e9ecef; align-self: flex-start; margin-top: 0; }
        .message-content { flex: 1; margin: 0; padding: 0; line-height: 1.4; white-space: normal; }
        .message-content span { display: inline-block; vertical-align: top; white-space: pre-wrap; }
        /* 마크다운 렌더링 후 span을 block으로 전환 */
        .message-content span.rendered { display: block; white-space: normal; }
        /* 마크다운 표 스타일 */
        .message-content table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
        .message-content th, .message-content td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; vertical-align: top; line-height: 1.5; }
        .message-content th { background-color: #eef2ff; font-weight: bold; }
        .message-content tr:nth-child(even) td { background-color: #f9f9f9; }
        /* 마크다운 ul/li 스타일 */
        .message-content ul,
        .message-content ol {
            margin: 4px 0;
            padding-left: 20px;
            list-style-position: outside;
        }
        .message-content li {
            margin: 2px 0;
        }
        /* 숫자 목록(1.~10.) 정렬을 위해 숫자 폭을 균등하게 설정 */
        .message-content ol li {
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum" 1;
        }
        .loading { font-style: italic; color: gray; }
        .related-articles-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #003b83;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .related-articles-container {
            margin-top: 10px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 8px;
            display: none;
        }
        .related-articles-container.show { display: block; }
        .article-item {
            padding: 8px;
            margin: 5px 0;
            background-color: white;
            border-left: 3px solid #003b83;
            border-radius: 4px;
        }

        /* O/X 피드백 버튼 */
        .feedback-area {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            margin-bottom: 16px; /* 피드백 아래에 여백을 줘서 다음 질문과 간격 확보 */
            padding-left: 30px; /* 아바타 너비만큼 들여쓰기 */
        }
        .feedback-label {
            font-size: 12px;
            color: #888;
        }
        .feedback-btn {
            padding: 4px 14px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .feedback-btn.ok {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
        .feedback-btn.ok:hover { background-color: #c8e6c9; }
        .feedback-btn.ng {
            background-color: #fce4ec;
            color: #c62828;
            border: 1px solid #f48fb1;
        }
        .feedback-btn.ng:hover { background-color: #f8bbd0; }
        .feedback-result {
            font-size: 12px;
            color: #888;
            font-style: italic;
        }

        .chat-input-area { display: flex; gap: 10px; }
        .chat-input-area input {
            flex-grow: 1;
            padding: 12px 18px;
            border: 1px solid rgba(0,59,131,0.2);
            border-radius: 14px;
            background: linear-gradient(160deg, rgba(255,255,255,0.75) 0%, rgba(238,244,255,0.65) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #1a2a4a;
            font-size: 14px;
            outline: none;
            box-shadow: 0 4px 22px rgba(0,59,131,0.12), inset 0 1px 0 rgba(255,255,255,0.98), inset 0 -1px 0 rgba(180,200,240,0.4);
            transition: all 0.25s ease;
        }
        .chat-input-area input::placeholder { color: rgba(43,72,95,0.4); }
        .chat-input-area input:focus {
            border-color: rgba(0,59,131,0.35);
            box-shadow: 0 4px 28px rgba(0,59,131,0.20), inset 0 1px 0 rgba(255,255,255,0.98), inset 0 -1px 0 rgba(150,180,230,0.5);
            background: linear-gradient(160deg, rgba(235,242,255,0.85) 0%, rgba(220,233,255,0.75) 100%);
        }
        .chat-input-area button {
            padding: 12px 22px;
            background: linear-gradient(135deg, #f8b616, #e6a800);
            color: #003b83;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(248,182,22,0.35);
        }
        .chat-input-area button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(248,182,22,0.5);
        }
        .chat-input-area button:disabled { background: #d0d8e8; color: #8a9ab8; cursor: not-allowed; box-shadow: none; }

        .ai-response {
            white-space: pre-wrap;
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
        }

        /* 파일 관리 영역 */
        .file-list-container { flex-grow: 1; overflow-y: auto; margin-bottom: 15px; }
        .file-list-container h3 { margin-top: 0; margin-bottom: 10px; }
        #fileList { padding-left: 0; margin: 0; list-style: none; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .file-item-content { display: flex; align-items: center; gap: 10px; flex: 1; }
        .file-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; margin: 0; }
        .file-item a { text-decoration: none; color: #003b83; flex: 1; }
        .file-item a:hover { text-decoration: underline; }
        .delete-btn { background-color: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .file-selection-info { margin-bottom: 10px; padding: 8px; background-color: #f8f9fa; border-radius: 4px; font-size: 13px; color: #666; }

        .upload-button-area { text-align: right; }
        #addFileBtn { padding: 10px 20px; background-color: #003b83; color: white; border: none; border-radius: 8px; cursor: pointer; }

        /* 모달 (팝업) 스타일 */
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fff; margin: 15% auto; padding: 30px; border: 1px solid #888; width: 400px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover, .close:focus { color: #333; text-decoration: none; }
        #uploadForm button { width: 100%; padding: 10px; margin-top: 15px; background-color: #f8b616; color: #003b83; border: none; border-radius: 5px; cursor: pointer; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
</head>
<body>
<div class="container">
    <!-- 왼쪽 절반: AI 채팅 -->
    <div class="pane left-pane">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
            <h2 style="display: flex; align-items: center; justify-content: center; gap: 10px; margin: -10px 0 0 0; flex: 1;">
                <img src="/images/cwmAi.png" alt="AI" style="width: 160px; height: 55px; border-radius: 0%; object-fit: cover; margin: 0; vertical-align: middle;" onerror="this.style.display='none';">
            </h2>
            <button id="logoutBtn" style="background: none; border: none; cursor: pointer; padding: 0; transition: all 0.3s ease; margin-top: -5px;" onmouseover="this.style.transform='translateY(-2px)'; this.style.opacity='0.8';" onmouseout="this.style.transform='translateY(0)'; this.style.opacity='1';">
                <img src="/images/logout.png" alt="로그아웃" style="width: 30px; height: 30px; object-fit: contain;" onerror="this.style.display='none';">
            </button>
        </div>
        <!-- 카테고리 선택 -->
        <div style="margin-bottom: 10px; display: flex; gap: 10px; align-items: center; justify-content: space-between;">
            <div style="display: flex; gap: 10px; align-items: center; flex: 1;">
                <label for="categorySelect" style="margin: 0; font-weight: bold; color: #555;">분야 선택: </label>
                <select id="categorySelect" style="padding: 8px; border: 1px solid #ccc; border-radius: 8px; min-width: 200px; font-size: 14px; flex: 1;"></select>
            </div>
            <button id="addCategoryBtn" style="padding: 8px 16px; background-color: #2b485f; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; white-space: nowrap; display: none;">분야 추가</button>
        </div>
        <!-- 여기에 ai-response 클래스 추가 -->
        <div id="chatBox" class="ai-response"></div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="메시지 입력">
            <button id="sendBtn">전송</button>
        </div>
    </div>

    <!-- 오른쪽 절반: 파일 목록 및 업로드 버튼 -->
    <div class="pane right-pane" id="rightPane">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <h2 style="margin: 0;">파일 관리</h2>
            <button id="hideFilePaneBtn" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #666; padding: 5px 10px;" title="파일 관리 영역 숨기기">&#10005;</button>
        </div>
        <div class="file-list-container">
            <h3>업로드된 파일</h3>
            <div class="file-selection-info" id="fileSelectionInfo">💡 파일을 선택하면 더 빠르고 정확한 답변을 받을 수 있어요!</div>
            <ul id="fileList"></ul>
        </div>
        <div class="upload-button-area" id="uploadButtonArea" style="display: none;">
            <button id="addFileBtn" onclick="openUploadModal()">파일 추가하기</button>
        </div>
    </div>
    <!-- 파일 관리 영역 토글 버튼 (숨김 상태일 때만 표시) -->
    <button id="showFilePaneBtn" class="toggle-file-pane-btn hidden" title="파일 관리 영역 보이기">◀</button>
</div>
<!-- 파일 업로드 모달 (팝업) -->
<div id="uploadModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeUploadModal()">&times;</span>
        <h3>파일 업로드</h3>
        <form id="uploadForm" enctype="multipart/form-data">
            <label for="uploadCategory">분야 선택: </label>
            <select id="uploadCategory" name="category" required></select>
            <br/><br/>
            <input type="file" id="fileInput" name="file" required />
            <button type="submit">업로드 시작</button>
        </form>
    </div>
</div>

<!-- 분야 추가 모달 (팝업) -->
<div id="categoryModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeCategoryModal()">&times;</span>
        <h3>분야 추가</h3>
        <form id="categoryForm">
            <label for="newCategoryInput">새 분야 명: </label>
            <input type="text" id="newCategoryInput" placeholder="분야명을 입력하세요" required
                   style="width: 100%; padding: 8px; margin-top: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;">
            <button type="submit" style="width: 100%; padding: 10px; margin-top: 15px; background-color: #f8b616; color: #003b83; border: none; border-radius: 5px; font-weight: 700; cursor: pointer;">추가하기</button>
        </form>
    </div>
</div>

<script>
    // --- 왼쪽 Pane (AI Chat) JavaScript ---
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const categorySelect = document.getElementById('categorySelect');
    const uploadCategorySelect = document.getElementById('uploadCategory');
    const newCategoryInput = document.getElementById('newCategoryInput');
    const addCategoryBtn = document.getElementById('addCategoryBtn');
    const categoryModal = document.getElementById('categoryModal');
    const categoryForm = document.getElementById('categoryForm');
    const defaultCategories = ["계약", "개인정보보호", "정보보안", "정보화사업", "공제사업"];

    // 엔터 키 입력 감지 이벤트 리스너 추가
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !sendBtn.disabled) {
            sendBtn.click(); // Enter 키 입력 시 전송 버튼 클릭 이벤트 실행
        }
    });

    // 점 애니메이션 함수
    function startDotAnimation(element, baseText) {
        let dotCount = 0;
        const interval = setInterval(() => {
            dotCount = (dotCount % 3) + 1;
            const dots = '.'.repeat(dotCount);
            element.textContent = baseText + dots;
        }, 500);
        return interval; // interval ID 반환하여 나중에 clearInterval 할 수 있게 함
    }

    // ── AI 메시지 말풍선 DOM 생성 헬퍼 ──────────────────────────────
    function createAiMessageDiv() {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', 'ai');
        const avatar = document.createElement('img');
        avatar.src = '/images/Cw_ci.png';
        avatar.alt = 'AI';
        avatar.classList.add('ai-avatar');
        avatar.onerror = function() { this.style.display = 'none'; };
        const content = document.createElement('div');
        content.classList.add('message-content');
        const textSpan = document.createElement('span');
        content.appendChild(textSpan);
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(content);
        return { messageDiv, textSpan };
    }

    // ── O/X 피드백 버튼 렌더링 ──────────────────────────────────────
    // pendingKey: 서버에서 받은 임시 캐시 키
    function renderFeedbackButtons(pendingKey) {
        const feedbackArea = document.createElement('div');
        feedbackArea.classList.add('feedback-area');

        const label = document.createElement('span');
        label.classList.add('feedback-label');
        label.textContent = '이 답변이 도움이 됐나요?';

        const okBtn = document.createElement('button');
        okBtn.classList.add('feedback-btn', 'ok');
        okBtn.textContent = '✓ 맞아요';

        const ngBtn = document.createElement('button');
        ngBtn.classList.add('feedback-btn', 'ng');
        ngBtn.textContent = '✗ 틀렸어요';

        const resultText = document.createElement('span');
        resultText.classList.add('feedback-result');

        okBtn.addEventListener('click', async () => {
            okBtn.disabled = true;
            ngBtn.disabled = true;
            await fetch(`/lm/api/feedback?pendingKey=${encodeURIComponent(pendingKey)}&approved=true`, { method: 'POST' });
            okBtn.style.display = 'none';
            ngBtn.style.display = 'none';
            resultText.textContent = '✓ 저장되었습니다.';
        });

        ngBtn.addEventListener('click', async () => {
            okBtn.disabled = true;
            ngBtn.disabled = true;
            await fetch(`/lm/api/feedback?pendingKey=${encodeURIComponent(pendingKey)}&approved=false`, { method: 'POST' });
            okBtn.style.display = 'none';
            ngBtn.style.display = 'none';
            resultText.textContent = '저장되지 않았습니다. 필요하면 다시 질문해 주세요.';
        });

        feedbackArea.appendChild(label);
        feedbackArea.appendChild(okBtn);
        feedbackArea.appendChild(ngBtn);
        feedbackArea.appendChild(resultText);
        return feedbackArea;
    }

    // ── HTTP 에러 체크 헬퍼 ─────────────────────────────────────────
    function checkResponse(res) {
        if (res.status === 401) {
            alert('로그인 세션이 만료되었습니다.\n다시 로그인해주세요.');
            window.location.href = '/loginPage';
            throw new Error('SESSION_EXPIRED');
        }
        if (!res.ok) {
            throw new Error(`HTTP_${res.status}`);
        }
        return res;
    }

    // ── 메인 질문 처리 함수 (재귀 재생성 지원) ──────────────────────
    async function processQuestion(question, category, selectedFilesArray, loadingDiv, loadingText, animationIntervalRef) {

        // 1단계: 관련 조항 추천
        const stage1Body = { files: selectedFilesArray };
        console.group('[DEBUG] Stage1 요청');
        console.log('질문:', question);
        console.log('카테고리:', category);
        console.log('선택 파일:', selectedFilesArray.length > 0 ? selectedFilesArray : '없음 (전체 검색)');
        console.groupEnd();

        const stage1Res = await fetch(
            `/lm/api/ask/stage1?question=${encodeURIComponent(question)}&category=${encodeURIComponent(category)}`,
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(stage1Body)
            }
        );
        checkResponse(stage1Res);
        const recommendedTitles = await stage1Res.json();
        console.log('[DEBUG] Stage1 결과 (LLM1이 선택한 조항):', recommendedTitles);

        if (!recommendedTitles || recommendedTitles.length === 0) {
            clearInterval(animationIntervalRef.id);
            chatBox.removeChild(loadingDiv);
            const { messageDiv, textSpan } = createAiMessageDiv();
            textSpan.textContent = '해당 분야의 관련 조항을 찾을 수 없습니다. 보다 정확한 법률 용어로 다시 질문해주세요.';
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            sendBtn.disabled = false;
            return;
        }

                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(recommendedTitles)
            }
        );

        // stage2 응답은 이제 JSON { answer, pendingKey }
        const stage2Result = await stage2Res.json();

        clearInterval(animationIntervalRef.id);
        chatBox.removeChild(loadingDiv);

            const cacheRes = await fetch(

            checkResponse(cacheRes);

            if (cacheResult.cached === true) {
                // 캐시 히트 → 즉시 표시 (이미 검증된 답변이므로 O/X 버튼 없음)

    async function addCategory(category) {

            alert('권한이 없습니다. 관리자만 분야를 추가할 수 있습니다.');
            return;

        const trimmed = category.trim();
        if (!trimmed) {
            alert('분야명을 입력해주세요.');
            return;
        }

        try {
            // 서버에 분야 추가 요청 (디렉토리 생성)
            const formData = new FormData();
            formData.append('category', trimmed);

            const response = await fetch('/api/categories/add', {
                method: 'POST',
                body: formData
            });

            const result = await response.text();

            if (result === 'success') {
                // 성공 시 select에 추가
                const targets = [categorySelect, uploadCategorySelect];
                targets.forEach(select => {
                    const exists = Array.from(select.options).some(opt => opt.value === trimmed);
                    if (!exists) {
                        const option = document.createElement('option');
                        option.value = trimmed;
                        option.textContent = trimmed;
                        select.appendChild(option);
                    }
                    select.value = trimmed;
                });
                closeCategoryModal();
                loadFiles();
            } else {
                alert(result);
            }

            console.error('분야 추가 오류:', error);

            // 파일명에서 확장자 제거 (마지막 . 이후 부분 제거)
            const fileNameWithoutExtension = file.lastIndexOf('.') > 0 ? file.substring(0, file.lastIndexOf('.')) : file;
            const isChecked = selectedFiles.has(file);

            const deleteButton = (typeof isAdmin !== 'undefined' && isAdmin)
                ? `<button class="delete-btn" onclick="deleteFile('${file}')">삭제</button>`
                : '';
            li.innerHTML = `
                <div class="file-item-content">
                    <input type="checkbox" id="file-${index}" data-filename="${file}" ${isChecked ? 'checked' : ''} onchange="handleFileSelection('${file}')">
                    <a href="/files/download?filename=${encodeURIComponent(file)}&category=${encodeURIComponent(currentCategory)}" download="${file}">${fileNameWithoutExtension}</a>
                </div>
                ${deleteButton}
            `;
            fileList.appendChild(li);
        });

        updateFileSelectionInfo();
    }

    // 파일 선택 처리 함수

        const checkbox = document.querySelector(`input[data-filename="${filename}"]`);

        if (checkbox.checked) {
            selectedFiles.add(filename);
        } else {
            // 선택 해제: 0개가 되면 "전체 파일 검색" 모드로 동작하도록 허용
            selectedFiles.delete(filename);

    // 답변 메시지 렌더링: 타이핑 애니메이션 후 마크다운 HTML로 변환
    function renderAnswerMessage(element, rawAnswer, callback) {
        // 타이핑 중에는 <br>을 줄바꿈으로 치환해 깔끔하게 표시
        const textForTyping = rawAnswer.replace(/<br\s*\/?>/gi, '\n');
        typeMessage(element, textForTyping, () => {
            // 타이핑 완료 후 마크다운 → HTML 렌더링
            try {
                element.classList.add('rendered');
                // 블록 요소(p 등) 앞에 따로 ":"를 두지 않고, 바로 내용이 시작되도록 렌더링
                element.innerHTML = marked.parse(rawAnswer);
            } catch (e) {
                console.warn('[marked] 파싱 실패, 텍스트 유지:', e);
            }
            if (callback) callback();
        });
    }

    // 타이핑 효과로 메시지 표시
    function typeMessage(element, text, callback) {
        // 기존 타이핑 애니메이션이 있으면 정리
        if (element.dataset.typingInterval) {
            clearInterval(parseInt(element.dataset.typingInterval));
        }

        element.textContent = '';
        let index = 0;
        const typingInterval = setInterval(() => {
            if (index < text.length) {
                element.textContent += text.charAt(index);
                index++;
                chatBox.scrollTop = chatBox.scrollHeight;
            } else {
                clearInterval(typingInterval);
                delete element.dataset.typingInterval;
                if (callback) callback();
            }
        }, 30); // 30ms마다 한 글자씩

        // interval ID를 element에 저장
        element.dataset.typingInterval = typingInterval.toString();
    }

    function updateCategoryMessage(selectedCategory) {
        const message = `현재 선택된 분야는 "${selectedCategory}"입니다. 이 분야에 대한 질문을 해주세요.\n오른쪽 파일 관리 탭에서 관련 파일을 선택하면 더 빠르고 정확한 답변을 받을 수 있습니다.\n선택하지 않으면 전체 파일을 참고하여 답변드려요.`;

        // 모든 분야 선택 메시지 찾기 (마지막 것을 찾기 위해)
        const allCategoryMessages = chatBox.querySelectorAll('.category-selection-message');
        const existingMessageDiv = allCategoryMessages.length > 0 ? allCategoryMessages[allCategoryMessages.length - 1] : null;

        if (existingMessageDiv) {
            // 기존 메시지 다음에 사용자 메시지나 AI 답변이 있는지 확인
            let hasSubsequentMessages = false;
            let nextSibling = existingMessageDiv.nextElementSibling;
            while (nextSibling) {
                if (nextSibling.classList.contains('message')) {
                    // 사용자 메시지이거나, 분야 선택 메시지가 아닌 AI 메시지인 경우
                    if (nextSibling.classList.contains('user') ||
                        (nextSibling.classList.contains('ai') && !nextSibling.classList.contains('category-selection-message'))) {
                        hasSubsequentMessages = true;
                        break;
                    }
                }
                nextSibling = nextSibling.nextElementSibling;
            }

            if (hasSubsequentMessages) {
                // 사용자 메시지나 AI 답변이 있으면 새로운 메시지 추가
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message', 'ai', 'category-selection-message');
                messageDiv.setAttribute('data-category-message', 'true');
                const avatarImg = document.createElement('img');
                avatarImg.src = '/images/Cw_ci.png';
                avatarImg.alt = 'AI';
                avatarImg.classList.add('ai-avatar');
                avatarImg.onerror = function() { this.style.display = 'none'; };
                const contentDiv = document.createElement('div');
                contentDiv.classList.add('message-content');
                const textSpan = document.createElement('span');
                contentDiv.appendChild(textSpan);
                messageDiv.appendChild(avatarImg);
                messageDiv.appendChild(contentDiv);
                chatBox.appendChild(messageDiv);
                typeMessage(textSpan, message);
            } else {
                // 사용자 메시지나 AI 답변이 없으면 기존 메시지 업데이트
                const textSpan = existingMessageDiv.querySelector('.message-content span');
                if (textSpan) {
                    typeMessage(textSpan, message);
                }
            }
        } else {
            // 기존 메시지가 없으면 새로 추가
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', 'ai', 'category-selection-message');
            messageDiv.setAttribute('data-category-message', 'true');
            const avatarImg = document.createElement('img');
            avatarImg.src = '/images/Cw_ci.png';
            avatarImg.alt = 'AI';
            avatarImg.classList.add('ai-avatar');
            avatarImg.onerror = function() { this.style.display = 'none'; };
            const contentDiv = document.createElement('div');
            contentDiv.classList.add('message-content');
            const textSpan = document.createElement('span');
            contentDiv.appendChild(textSpan);
            messageDiv.appendChild(avatarImg);
            messageDiv.appendChild(contentDiv);
            chatBox.appendChild(messageDiv);
            typeMessage(textSpan, message);
        }
    }

    // 카테고리 변경 시 파일 목록 갱신 및 AI 메시지 표시
    categorySelect.addEventListener('change', () => {
        const selectedCategory = categorySelect.value;
        if (selectedCategory) {
            updateCategoryMessage(selectedCategory);
        }
        // 분야 변경 시 선택된 파일 초기화
        selectedFiles.clear();
        loadFiles();
    });
</script>
